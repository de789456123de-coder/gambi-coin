<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Gambi, o robô remendado">
  <!-- antena de Bombril -->
  <line x1="100" y1="46" x2="100" y2="22" stroke="#9aa3ad" stroke-width="4"/>
  <circle cx="100" cy="18" r="9" fill="#cfd6dd" stroke="#6b7580" stroke-width="2"/>
  <path d="M93 14 q7 -6 14 0 M92 20 q8 5 16 0" stroke="#6b7580" stroke-width="1.5" fill="none"/>
  <!-- cabeça -->
  <rect x="38" y="46" width="124" height="104" rx="18" fill="#2fb36b" stroke="#12402a" stroke-width="5"/>
  <!-- parafuso solto -->
  <circle cx="52" cy="60" r="5" fill="#cfd6dd" stroke="#12402a" stroke-width="2"/>
  <line x1="49" y1="60" x2="55" y2="60" stroke="#12402a" stroke-width="2"/>
  <!-- olhos (um maior que o outro) -->
  <circle cx="76" cy="92" r="17" fill="#fff" stroke="#12402a" stroke-width="4"/>
  <circle cx="80" cy="94" r="7" fill="#12402a"/>
  <circle cx="128" cy="92" r="12" fill="#fff" stroke="#12402a" stroke-width="4"/>
  <circle cx="125" cy="94" r="5" fill="#12402a"/>
  <!-- fita silver tape em X -->
  <g transform="rotate(-24 128 70)">
    <rect x="106" y="62" width="48" height="14" rx="2" fill="#c9cdd2" stroke="#7d848c" stroke-width="2"/>
    <path d="M110 62v14M118 62v14M126 62v14M134 62v14M142 62v14M150 62v14" stroke="#aeb3b9" stroke-width="1"/>
  </g>
  <g transform="rotate(20 128 70)">
    <rect x="106" y="62" width="48" height="14" rx="2" fill="#d6dade" stroke="#7d848c" stroke-width="2"/>
  </g>
  <!-- boca com sorriso torto -->
  <path d="M70 124 q30 18 62 -4" stroke="#12402a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- clipe de papel na orelha -->
  <path d="M162 88 h14 a6 6 0 0 1 0 12 h-18 a4 4 0 0 1 0 -8 h14" stroke="#9aa3ad" stroke-width="3" fill="none"/>
  <!-- corpo -->
  <rect x="62" y="150" width="76" height="36" rx="8" fill="#f4c430" stroke="#12402a" stroke-width="5"/>
  <text x="100" y="175" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" textLength="62" lengthAdjust="spacingAndGlyphs" fill="#12402a">$GAMBI</text>
</svg>
